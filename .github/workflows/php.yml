name: PHP checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.5']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, mbstring
          coverage: none
          tools: none

      - name: Check PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -n 1 php -l

      - name: Run standalone module tests
        run: |
          php test/run_business_rules.php
          php test/run_agenda_contracts.php
          php test/run_regulatory_contracts.php
          php test/run_ui_contracts.php
          php test/run_consumption_od_contracts.php
          php test/run_native_import.php
          php test/run_capacity_import_transactions.php
